<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
    }
    body {
        display: flex;
        justify-self: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background-color: gainsboro;
        padding: 10px;
        width: 300px;
    }

    .header {
        background-color: blue;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px;
    }

    .actions {
        display: flex;
        gap: 10px;
    }

    .body {
        display: flex;
        flex-direction: column;
        height: 150px;
    }

    .row-body-1 {
        flex: 1;
        display: flex;
        justify-content: center;
    }
    .row-body-2 {
        flex: 1;
        display: flex;
        justify-content: center;
    }
    .row-body-1 > div {
        width: 70px;
        background-color: brown;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid;
    }
    .row-body-2 > div {
        width: 70px;
        background-color: brown;
        border: 1px solid;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .footer {
        background-color: aquamarine;
        height: 50px;
        display: flex;
        justify-content: center;
    }

    .footer div {
        background-color: blue;
        height: 100%;
        width: 150px;
    }
</style>  

<body>
    <div class="container">
        <div class="header">
            <p>17 de marco 2022</p>
            <div class="actions">
                <p>Signup</p>
                <p>Login</p>
            </div>
        </div>
        <div class="body">
            <div class="row-body-1">
                <div>2</div>
                <div>3</div>
                <div>4</div>
            </div>
            <div class="row-body-2">
                <div>1</div>
                <div>2</div>
            </div>
        </div>
        <div class="footer">
            <div></div>
        </div>
    </div>
</body>
</html>
