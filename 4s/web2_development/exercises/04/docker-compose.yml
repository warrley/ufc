services:
  app:
    build: .
    container_name: express_api
    restart: always
    ports:
      - "31416:31416"
    environment:
      - PORT=31416
      - MONGO_URI=mongodb://mongodb:27017/crud_express_db
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
